#cloud-config
# Requires an explicitly reviewed image with Python 3, cloud-init and systemd.
# No package installation, downloads, credentials or outbound access are needed.
write_files:
  - path: /opt/foundation/health.py
    owner: root:root
    permissions: '0644'
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Health(BaseHTTPRequestHandler):
          def do_GET(self):
              status = 200 if self.path == "/healthz" else 404
              body = b"ok\n" if status == 200 else b"not found\n"
              self.send_response(status)
              self.send_header("Content-Type", "text/plain; charset=utf-8")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

      HTTPServer(("127.0.0.1", 8080), Health).serve_forever()
  - path: /etc/systemd/system/foundation-health.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Local foundation health fixture
      After=network.target

      [Service]
      Type=simple
      DynamicUser=yes
      ExecStart=/usr/bin/python3 /opt/foundation/health.py
      Restart=on-failure
      NoNewPrivileges=yes
      PrivateTmp=yes
      ProtectSystem=strict
      ProtectHome=yes
      RestrictAddressFamilies=AF_INET
      CapabilityBoundingSet=

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, foundation-health.service]
